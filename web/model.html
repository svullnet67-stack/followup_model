<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练模型 · 跟进状态判断</title><style>body{font:16px/1.7 system-ui;background:#f3f6fb;color:#203047;max-width:900px;margin:30px auto;padding:20px}main{background:white;border-radius:18px;padding:28px}textarea,input{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:8px;font:inherit;margin:8px 0 20px}button{padding:12px 20px;background:#315fe5;color:white;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;background:#f0f4ff;padding:20px}a{color:#315fe5}</style></head><body><main><a href="./index.html">← 返回多轮沟通规则复盘</a><h1>训练模型 · 跟进状态判断</h1><p>使用你的七分类模型。先明确要核对的行动，再粘贴相关原话。结果需人工复核。</p><p>点击分析会将以下文本发送到部署本程序的服务器，不调用ChatGPT或DeepSeek。</p><label>目标行动<input id="action" maxlength="500" placeholder="例如：老师发送学习方案"></label><label>历史沟通<textarea id="history" rows="4" maxlength="5000"></textarea></label><label>本次沟通<textarea id="current" rows="4" maxlength="5000"></textarea></label><button id="run">使用训练模型分析</button> <button id="sample">填入示例</button><pre id="result" aria-live="polite">等待分析</pre><p>本页不自动保存文本。模型分数不是经过校准的正确概率。完整录音请先选取相关片段。</p></main><script src="./model.js"></script></body></html>
